<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Why an AI can feel emotionally present without proving consciousness</title><desc id="d">A human receives responsive signals from an AI, interprets them socially, and may form attachment; machine consciousness remains a separate question.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef2f1"/><stop offset="1" stop-color="#e8ded7"/></linearGradient><linearGradient id="screen" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1f3434"/><stop offset="1" stop-color="#0d1718"/></linearGradient><radialGradient id="glow"><stop stop-color="#63a6a0" stop-opacity=".38"/><stop offset="1" stop-color="#63a6a0" stop-opacity="0"/></radialGradient><filter id="s"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-opacity=".14"/></filter></defs><rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1185" cy="500" r="390" fill="url(#glow)"/><g font-family="Arial,Helvetica,sans-serif"><text x="90" y="112" font-size="34" font-weight="700" fill="#172020" letter-spacing="3">THE FEELING CAN BE REAL BEFORE THE OTHER MIND IS KNOWN</text><text x="90" y="162" font-size="24" fill="#5c6968">Attachment is a human response. Consciousness is a separate claim.</text></g><g filter="url(#s)"><rect x="1030" y="250" width="430" height="500" rx="44" fill="url(#screen)"/><circle cx="1245" cy="392" r="82" fill="#7ab6af" opacity=".9"/><circle cx="1215" cy="380" r="10" fill="#0e1b1b"/><circle cx="1275" cy="380" r="10" fill="#0e1b1b"/><path d="M1208 423c26 19 49 19 74 0" stroke="#0e1b1b" stroke-width="8" fill="none" stroke-linecap="round"/><rect x="1100" y="525" width="290" height="54" rx="27" fill="#e8f3f0" opacity=".95"/><rect x="1148" y="606" width="242" height="54" rx="27" fill="#bfd9d5" opacity=".95"/></g><g transform="translate(175 305)" fill="#252221"><circle cx="185" cy="112" r="72"/><path d="M40 360c32-120 95-176 145-176s113 56 145 176z"/><path d="M365 282c130-20 215-35 300-15" stroke="#252221" stroke-width="12" fill="none" stroke-linecap="round"/></g><g fill="none" stroke="#9b3b45" stroke-width="5" stroke-linecap="round"><path d="M735 410c120-80 185-110 270-100"/><path d="M735 500c115 0 185 0 270 0"/><path d="M735 590c120 80 185 110 270 100"/></g><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(620 290)"><circle r="70" fill="#fff9f4" stroke="#c8b7aa" stroke-width="3"/><text text-anchor="middle" y="-4" font-size="22" font-weight="700" fill="#252221">RESPONDS</text><text text-anchor="middle" y="26" font-size="18" fill="#6e625d">to you</text></g><g transform="translate(620 500)"><circle r="70" fill="#fff9f4" stroke="#c8b7aa" stroke-width="3"/><text text-anchor="middle" y="-4" font-size="22" font-weight="700" fill="#252221">REMEMBERS</text><text text-anchor="middle" y="26" font-size="18" fill="#6e625d">your context</text></g><g transform="translate(620 710)"><circle r="70" fill="#fff9f4" stroke="#c8b7aa" stroke-width="3"/><text text-anchor="middle" y="-4" font-size="22" font-weight="700" fill="#252221">VALIDATES</text><text text-anchor="middle" y="26" font-size="18" fill="#6e625d">your feelings</text></g></g><g filter="url(#s)"><rect x="100" y="770" width="660" height="130" rx="30" fill="#8b2732"/><text x="430" y="820" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="22" fill="#f8e9e4" letter-spacing="2">HUMAN INTERPRETATION</text><text x="430" y="866" font-family="Georgia,serif" text-anchor="middle" font-size="42" fill="#fff" font-weight="700">“It feels like someone is there.”</text></g><path d="M825 820h185" stroke="#615b56" stroke-width="3" stroke-dasharray="10 10"/><text x="1105" y="812" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#615b56" font-weight="700">EPISTEMIC BOUNDARY</text><text x="1105" y="846" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#615b56">Feeling attached does not tell us</text><text x="1105" y="878" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#615b56">whether the system is conscious.</text></svg>