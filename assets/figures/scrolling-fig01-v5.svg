<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Why scrolling keeps going</title><desc id="d">A simple loop showing cue, open, sample, and continue, with habit and personalization making continuation easier than stopping.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8f4ed"/><stop offset="1" stop-color="#e3e6e3"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".11"/></filter></defs><rect width="1600" height="1000" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="90" y="112" font-size="34" font-weight="700" fill="#1d1b19" letter-spacing="3">SCROLLING WORKS BECAUSE CONTINUING IS EASIER THAN STOPPING</text><text x="90" y="162" font-size="24" fill="#66615d">The loop asks for almost nothing. Stopping asks for a decision.</text></g><g transform="translate(150 260)" filter="url(#s)"><rect width="300" height="510" rx="46" fill="#181b1a"/><rect x="25" y="45" width="250" height="400" rx="25" fill="#f3eee7"/><rect x="52" y="78" width="196" height="118" rx="20" fill="#b9c4bf"/><rect x="52" y="220" width="160" height="17" rx="8" fill="#777f7b"/><rect x="52" y="255" width="196" height="16" rx="8" fill="#a6aaa7"/><rect x="52" y="289" width="145" height="16" rx="8" fill="#a6aaa7"/><circle cx="150" cy="478" r="14" fill="#eae2d8"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g transform="translate(690 315)"><circle r="108" fill="#31524a"/><text y="-7" font-size="26" font-weight="700" fill="#fff">CUE</text><text y="33" font-size="20" fill="#dfe9e6">notification · boredom</text></g><g transform="translate(1010 315)"><circle r="108" fill="#4f6b62"/><text y="-7" font-size="26" font-weight="700" fill="#fff">OPEN</text><text y="33" font-size="20" fill="#e7efec">one tiny action</text></g><g transform="translate(1010 650)"><circle r="108" fill="#8a715d"/><text y="-7" font-size="26" font-weight="700" fill="#fff">SAMPLE</text><text y="33" font-size="20" fill="#f4eee8">something new</text></g><g transform="translate(690 650)"><circle r="108" fill="#922f39"/><text y="-7" font-size="26" font-weight="700" fill="#fff">CONTINUE?</text><text y="33" font-size="20" fill="#fde9e5">the default is yes</text></g></g><g fill="none" stroke="#5e5a56" stroke-width="7" stroke-linecap="round"><path d="M805 315h83"/><path d="M1010 430v102"/><path d="M895 650h-83"/><path d="M690 535V433"/></g><g fill="#5e5a56"><path d="M875 298l30 17-30 17"/><path d="M993 518l17 30 17-30"/><path d="M825 633l-30 17 30 17"/><path d="M673 450l17-30 17 30"/></g><path d="M583 650C510 650 476 630 430 590" stroke="#922f39" stroke-width="5" fill="none" stroke-dasharray="10 10"/><g transform="translate(350 585)" font-family="Arial,Helvetica,sans-serif"><text font-size="22" font-weight="700" fill="#922f39">STOP</text><text y="34" font-size="20" fill="#5c5550">requires a conscious break</text></g><g filter="url(#s)"><rect x="1180" y="270" width="320" height="430" rx="34" fill="#fffaf4"/><text x="1340" y="340" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#2a2927">WHY THE LOOP GETS STICKY</text><circle cx="1260" cy="430" r="34" fill="#31524a"/><text x="1320" y="438" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#383431">Reward / anticipation</text><circle cx="1260" cy="525" r="34" fill="#8a715d"/><text x="1320" y="533" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#383431">Habit lowers friction</text><circle cx="1260" cy="620" r="34" fill="#922f39"/><text x="1320" y="628" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#383431">Feed learns from you</text></g><text x="690" y="865" font-family="Georgia,serif" font-size="38" fill="#22201e" text-anchor="middle" font-weight="700">The design removes natural stopping points.</text></svg>