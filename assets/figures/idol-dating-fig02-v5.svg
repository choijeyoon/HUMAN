<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Evidence landscape for idol dating reactions</title><desc id="d">A simple landscape showing where evidence is strong, indirect, and still missing.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#fbf7f0"/><stop offset="1" stop-color="#efe5db"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".1"/></filter></defs><rect width="1600" height="1000" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="90" y="110" font-size="34" font-weight="700" fill="#1d1b19" letter-spacing="3">WHAT DO WE ACTUALLY KNOW?</text><text x="90" y="160" font-size="24" fill="#6f655f">The closer we get to idol-dating itself, the thinner the evidence becomes.</text></g><path d="M175 760C355 580 500 565 665 620C825 672 950 560 1110 420C1240 306 1368 300 1470 340" fill="none" stroke="#d4c5b8" stroke-width="10" stroke-linecap="round"/><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><g filter="url(#s)"><circle cx="300" cy="650" r="118" fill="#244b3f"/><text x="300" y="628" font-size="24" fill="#dcebe5" font-weight="700">PARASOCIAL</text><text x="300" y="663" font-size="24" fill="#dcebe5" font-weight="700">RELATIONSHIPS</text><text x="300" y="713" font-size="19" fill="#fff">Strong base</text></g><g filter="url(#s)"><circle cx="665" cy="598" r="102" fill="#6f7761"/><text x="665" y="580" font-size="22" fill="#fff" font-weight="700">DISRUPTION</text><text x="665" y="613" font-size="22" fill="#fff" font-weight="700">& LOSS</text><text x="665" y="656" font-size="18" fill="#f3f1e7">Moderate</text></g><g filter="url(#s)"><circle cx="1045" cy="455" r="94" fill="#a36f50"/><text x="1045" y="440" font-size="22" fill="#fff" font-weight="700">K-POP</text><text x="1045" y="472" font-size="22" fill="#fff" font-weight="700">FANDOM</text><text x="1045" y="515" font-size="18" fill="#fff4eb">Growing</text></g><g filter="url(#s)"><circle cx="1350" cy="350" r="112" fill="#8d2732"/><text x="1350" y="328" font-size="22" fill="#fff" font-weight="700">IDOL DATING</text><text x="1350" y="362" font-size="22" fill="#fff" font-weight="700">EXPERIMENT</text><text x="1350" y="411" font-size="19" fill="#ffe9e6">Still open</text></g></g><g stroke="#5d544e" stroke-width="3" fill="none"><path d="M300 785v62M665 720v127M1045 568v279M1350 482v365"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle" fill="#4f4843"><text x="300" y="888" font-size="21">well established</text><text x="665" y="888" font-size="21">closest analogue</text><text x="1045" y="888" font-size="21">context matters</text><text x="1350" y="888" font-size="21">direct test missing</text></g><g transform="translate(96 270)" font-family="Arial,Helvetica,sans-serif"><text font-size="21" fill="#8d2732" font-weight="700">READ THIS LEFT → RIGHT</text><text y="34" font-size="20" fill="#625a55">Evidence gets more specific — and less certain.</text></g></svg>