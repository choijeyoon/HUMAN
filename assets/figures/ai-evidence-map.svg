<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evidence ladder for human AI relationships</title>
  <desc id="desc">A stepped evidence ladder separating short experimental connection, randomized relationship building, longitudinal chatbot use, and real-world wellbeing evidence. Machine consciousness is shown outside the evidence ladder because these studies do not test it.</desc>
  <rect width="1600" height="900" fill="#f3f0e8"/>

  <text x="72" y="62" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#11110f">FIG. 02 / EVIDENCE</text>
  <text x="72" y="112" font-family="Georgia,Times New Roman,serif" font-size="48" fill="#11110f">Evidence is strongest for immediate human response.</text>
  <text x="72" y="145" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6d6961">As the question moves toward durable benefit and machine consciousness, the evidence becomes less direct.</text>
  <line x1="72" y1="190" x2="1528" y2="190" stroke="#b9b4aa"/>

  <!-- duration axis -->
  <line x1="140" y1="720" x2="1160" y2="720" stroke="#11110f" stroke-width="1.5"/>
  <path d="M1160 720l-12-6v12z" fill="#11110f"/>
  <text x="140" y="752" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="2" fill="#6d6961">MINUTES</text>
  <text x="1080" y="752" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="2" fill="#6d6961">LONGER-TERM USE</text>

  <!-- step 1 -->
  <g transform="translate(140 565)">
    <rect width="230" height="130" fill="#11110f"/>
    <text x="20" y="28" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#f3f0e8">EXPERIMENT</text>
    <text x="20" y="61" font-family="Georgia,Times New Roman,serif" font-size="25" fill="#f3f0e8">Immediate connection</text>
    <text x="20" y="90" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d8d3ca">Folk et al. · N=1,274</text>
    <text x="20" y="112" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d8d3ca">chatbot vs journaling</text>
  </g>

  <!-- step 2 -->
  <g transform="translate(390 485)">
    <rect width="250" height="210" fill="none" stroke="#6e211b" stroke-width="2"/>
    <text x="20" y="30" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#6e211b">RANDOMIZED RELATIONSHIP BUILDING</text>
    <text x="20" y="67" font-family="Georgia,Times New Roman,serif" font-size="25" fill="#11110f">Short-term closeness</text>
    <text x="20" y="100" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6d6961">Kleinert et al. · N=492</text>
    <text x="20" y="123" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6d6961">AI label reduces, not erases, closeness</text>
    <line x1="20" y1="155" x2="230" y2="155" stroke="#b9b4aa"/>
    <text x="20" y="184" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6" fill="#6e211b">CAUSAL / SHORT TERM</text>
  </g>

  <!-- step 3 -->
  <g transform="translate(660 405)">
    <rect width="250" height="290" fill="none" stroke="#11110f"/>
    <text x="20" y="30" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#6e211b">LONGITUDINAL</text>
    <text x="20" y="67" font-family="Georgia,Times New Roman,serif" font-size="25" fill="#11110f">Durability is not automatic</text>
    <text x="20" y="100" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6d6961">Mitsuku study · N=118 · 3 weeks</text>
    <text x="20" y="135" font-family="Georgia,Times New Roman,serif" font-size="19" fill="#11110f">Social attraction and intimacy</text>
    <text x="20" y="160" font-family="Georgia,Times New Roman,serif" font-size="19" fill="#11110f">declined across sessions.</text>
    <line x1="20" y1="205" x2="230" y2="205" stroke="#b9b4aa"/>
    <text x="20" y="236" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#11110f">TIME ADDS A DIFFERENT TEST</text>
  </g>

  <!-- step 4 -->
  <g transform="translate(930 325)">
    <rect width="250" height="370" fill="none" stroke="#b9b4aa"/>
    <text x="20" y="30" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#6e211b">REAL-WORLD USERS</text>
    <text x="20" y="67" font-family="Georgia,Times New Roman,serif" font-size="25" fill="#11110f">Wellbeing remains unsettled</text>
    <text x="20" y="100" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6d6961">Observational sample · N=1,131</text>
    <text x="20" y="135" font-family="Georgia,Times New Roman,serif" font-size="19" fill="#11110f">Companionship use can coexist</text>
    <text x="20" y="160" font-family="Georgia,Times New Roman,serif" font-size="19" fill="#11110f">with positive or negative outcomes.</text>
    <line x1="20" y1="215" x2="230" y2="215" stroke="#b9b4aa"/>
    <text x="20" y="246" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#6d6961">OBSERVATIONAL</text>
    <text x="20" y="274" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6d6961">No causal long-term claim.</text>
  </g>

  <!-- outside the ladder -->
  <g transform="translate(1360 455)">
    <circle r="118" fill="none" stroke="#6e211b" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="0" y="-16" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="28" fill="#6e211b">Consciousness?</text>
    <text x="0" y="18" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.7" fill="#6e211b">NOT TESTED HERE</text>
    <text x="0" y="47" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6d6961">requires different evidence</text>
  </g>

  <text x="72" y="836" font-family="Georgia,Times New Roman,serif" font-size="29" fill="#11110f">The studies can establish human connection without establishing reciprocal experience in the system.</text>
  <text x="72" y="870" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#6d6961">STEP HEIGHT REPRESENTS QUESTION SCOPE, NOT EFFECT SIZE.</text>
</svg>
