<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Human attachment and machine consciousness are different questions</title>
  <desc id="desc">A vertical conceptual stack showing observable AI behaviour, perceived responsiveness, human attachment, and a separate unresolved question of machine consciousness below an epistemic boundary.</desc>
  <rect width="1600" height="900" fill="#f3f0e8"/>

  <text x="72" y="62" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#11110f">FIG. 01 / MECHANISM</text>
  <text x="72" y="112" font-family="Georgia,Times New Roman,serif" font-size="48" fill="#11110f">Attachment can emerge before the machine’s inner status is known.</text>
  <text x="72" y="145" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6d6961">The human response and the machine-consciousness question belong to different levels of explanation.</text>
  <line x1="72" y1="190" x2="1528" y2="190" stroke="#b9b4aa"/>

  <!-- central stack -->
  <g transform="translate(520 245)">
    <text x="0" y="0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.8" fill="#6e211b">01 / OBSERVABLE SYSTEM BEHAVIOUR</text>
    <rect x="0" y="24" width="560" height="92" rx="4" fill="none" stroke="#11110f"/>
    <text x="32" y="69" font-family="Georgia,Times New Roman,serif" font-size="27" fill="#11110f">memory · contingency · availability</text>
    <text x="32" y="95" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6d6961">what the system does in the interaction</text>

    <path d="M280 116V150" stroke="#6e211b" stroke-width="2.4"/>
    <path d="M280 150l-7-12h14z" fill="#6e211b"/>

    <text x="0" y="184" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.8" fill="#6e211b">02 / HUMAN INTERPRETATION</text>
    <rect x="0" y="208" width="560" height="92" rx="4" fill="#11110f"/>
    <text x="32" y="252" font-family="Georgia,Times New Roman,serif" font-size="29" fill="#f3f0e8">“It responds to me.”</text>
    <text x="32" y="278" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#d6d1c8">perceived responsiveness · agency · reciprocity</text>

    <path d="M280 300V334" stroke="#6e211b" stroke-width="2.4"/>
    <path d="M280 334l-7-12h14z" fill="#6e211b"/>

    <text x="0" y="368" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.8" fill="#6e211b">03 / HUMAN RESPONSE</text>
    <rect x="0" y="392" width="560" height="108" rx="4" fill="none" stroke="#6e211b" stroke-width="2"/>
    <text x="32" y="440" font-family="Georgia,Times New Roman,serif" font-size="34" fill="#11110f">Attachment can become real.</text>
    <text x="32" y="472" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6d6961">closeness · missing the system · romantic meaning</text>
  </g>

  <!-- epistemic boundary -->
  <line x1="300" y1="790" x2="1300" y2="790" stroke="#6e211b" stroke-width="2.5" stroke-dasharray="12 10"/>
  <rect x="610" y="774" width="380" height="32" fill="#f3f0e8"/>
  <text x="800" y="795" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#6e211b">EPISTEMIC BOUNDARY</text>

  <!-- separate question -->
  <g transform="translate(1160 330)">
    <circle cx="0" cy="0" r="145" fill="none" stroke="#b9b4aa"/>
    <circle cx="0" cy="0" r="96" fill="none" stroke="#b9b4aa" stroke-dasharray="5 7"/>
    <text x="0" y="-12" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="33" fill="#11110f">Consciousness?</text>
    <text x="0" y="26" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.6" fill="#6d6961">SEPARATE EVIDENCE NEEDED</text>
  </g>
  <path d="M1080 520 C1160 560 1190 600 1190 645" fill="none" stroke="#b9b4aa" stroke-width="1.2" stroke-dasharray="5 7"/>
  <text x="1210" y="653" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#6d6961">no valid inference from attachment alone</text>

  <!-- takeaway -->
  <text x="72" y="844" font-family="Georgia,Times New Roman,serif" font-size="29" fill="#11110f">Human love can be psychologically meaningful without proving that the AI experiences anything.</text>
  <text x="72" y="874" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#6d6961">CONCEPTUAL FIGURE · THE ARROWS DESCRIBE LEVELS OF HUMAN INTERPRETATION, NOT A CLAIM OF MACHINE SUBJECTIVITY.</text>
</svg>
