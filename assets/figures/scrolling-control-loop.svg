<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Why continuing can become easier than stopping</title>
  <desc id="desc">A minimal control loop showing cue, feed opening, sampling, and a continue-or-stop decision. Habit lowers deliberation, recommendation systems alter the next sample, and interface friction determines how often an explicit stop decision occurs.</desc>
  <rect width="1600" height="900" fill="#f3f0e8"/>

  <text x="72" y="62" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#11110f">FIG. 01 / MECHANISM</text>
  <text x="72" y="112" font-family="Georgia,Times New Roman,serif" font-size="48" fill="#11110f">Scrolling persists when “continue” is the default path.</text>
  <text x="72" y="145" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6d6961">Reward-sensitive sampling, habit and personalization can all feed the loop; none is sufficient alone.</text>
  <line x1="72" y1="190" x2="1528" y2="190" stroke="#b9b4aa"/>

  <!-- main loop -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.4" fill="#6e211b">
    <text x="120" y="272">01</text><text x="440" y="272">02</text><text x="760" y="272">03</text><text x="1080" y="272">04</text>
  </g>
  <g font-family="Georgia,Times New Roman,serif" fill="#11110f">
    <text x="120" y="320" font-size="34">Cue</text>
    <text x="440" y="320" font-size="34">Open</text>
    <text x="760" y="320" font-size="34">Sample</text>
    <text x="1080" y="320" font-size="34">Continue?</text>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6d6961">
    <text x="120" y="350">boredom · notification</text>
    <text x="440" y="350">one action starts the feed</text>
    <text x="760" y="350">novelty · relevance · surprise</text>
    <text x="1080" y="350">another item may be better</text>
  </g>

  <g fill="none" stroke="#6e211b" stroke-width="2.6">
    <path d="M220 410H390"/>
    <path d="M540 410H710"/>
    <path d="M860 410H1030"/>
    <path d="M1170 410 C1290 410 1320 500 1320 575 C1320 690 1110 720 820 720 C510 720 300 680 300 555 C300 500 330 455 390 430"/>
  </g>
  <g fill="#6e211b">
    <path d="M390 410l-13-7v14z"/><path d="M710 410l-13-7v14z"/><path d="M1030 410l-13-7v14z"/><path d="M390 430l-12-6 2 13z"/>
  </g>

  <!-- continue vs stop gate -->
  <circle cx="1160" cy="410" r="72" fill="#11110f"/>
  <text x="1160" y="401" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#f3f0e8">DEFAULT</text>
  <text x="1160" y="430" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="23" fill="#f3f0e8">continue</text>

  <path d="M1160 482V585" stroke="#11110f" stroke-width="1.8"/>
  <path d="M1160 585l-7-12h14z" fill="#11110f"/>
  <rect x="1040" y="590" width="240" height="92" rx="4" fill="none" stroke="#11110f"/>
  <text x="1160" y="627" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2" fill="#6e211b">EXPLICIT STOP GATE</text>
  <text x="1160" y="658" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#11110f">“Do I keep going?”</text>

  <!-- forces -->
  <g transform="translate(140 510)">
    <text x="0" y="0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#6e211b">HABIT</text>
    <text x="0" y="32" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#11110f">Less re-evaluation.</text>
    <text x="0" y="58" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6d6961">Repeated swiping can become more automatic.</text>
  </g>
  <path d="M330 548 C420 600 500 650 640 690" fill="none" stroke="#b9b4aa" stroke-width="1.4"/>

  <g transform="translate(690 520)">
    <text x="0" y="0" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#6e211b">PERSONALIZATION</text>
    <text x="0" y="32" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#11110f">The next sample changes.</text>
    <text x="0" y="58" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6d6961">Your behavior helps shape what appears next.</text>
  </g>
  <path d="M865 558 C900 530 900 475 845 440" fill="none" stroke="#b9b4aa" stroke-width="1.4" stroke-dasharray="5 6"/>

  <!-- stopping-point strip -->
  <rect x="1340" y="300" width="190" height="380" fill="#11110f"/>
  <text x="1362" y="336" font-family="Helvetica,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#f3f0e8">FRICTION</text>
  <text x="1362" y="380" font-family="Georgia,Times New Roman,serif" font-size="24" fill="#f3f0e8">More stopping</text>
  <text x="1362" y="408" font-family="Georgia,Times New Roman,serif" font-size="24" fill="#f3f0e8">points make</text>
  <text x="1362" y="436" font-family="Georgia,Times New Roman,serif" font-size="24" fill="#f3f0e8">continuation</text>
  <text x="1362" y="464" font-family="Georgia,Times New Roman,serif" font-size="24" fill="#f3f0e8">a decision again.</text>
  <line x1="1362" y1="510" x2="1508" y2="510" stroke="#6e211b" stroke-width="2"/>
  <text x="1362" y="548" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d9d4cb">pagination</text>
  <text x="1362" y="576" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d9d4cb">time reminder</text>
  <text x="1362" y="604" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#d9d4cb">end of queue</text>

  <line x1="72" y1="790" x2="1528" y2="790" stroke="#b9b4aa"/>
  <text x="72" y="838" font-family="Georgia,Times New Roman,serif" font-size="29" fill="#11110f">The loop is powerful because continuing can require less deliberation than stopping.</text>
  <text x="72" y="872" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#6d6961">CONCEPTUAL SYNTHESIS · LOOP GEOMETRY DOES NOT REPRESENT EFFECT SIZE OR A SINGLE FITTED MODEL.</text>
</svg>
