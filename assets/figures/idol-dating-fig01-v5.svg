<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">How repeated exposure makes an idol feel socially familiar</title><desc id="d">Media moments gather into a stable social model, then dating news creates an expectation update.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f2ea"/><stop offset="1" stop-color="#ead8d0"/></linearGradient><radialGradient id="halo"><stop stop-color="#a32734" stop-opacity=".24"/><stop offset="1" stop-color="#a32734" stop-opacity="0"/></radialGradient><filter id="s"><feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity=".12"/></filter></defs><rect width="1600" height="1000" fill="url(#bg)"/><circle cx="1240" cy="500" r="340" fill="url(#halo)"/><g font-family="Arial,Helvetica,sans-serif"><text x="90" y="112" font-size="34" font-weight="700" fill="#1e1b19" letter-spacing="3">REPEATED MOMENTS BECOME A SOCIAL MODEL</text><text x="90" y="162" font-size="24" fill="#6f655f">You never meet the person — but your mind keeps learning them.</text></g><g transform="translate(95 270)" fill="none" stroke="#574f4a" stroke-width="4"><rect width="195" height="125" rx="24"/><path d="M38 88l43-41 34 31 34-43 29 53"/><rect y="165" width="195" height="125" rx="24"/><circle cx="64" cy="228" r="19"/><path d="M105 205h48M105 230h61M105 255h42"/><rect y="330" width="195" height="125" rx="24"/><path d="M37 389h118M37 420h86"/><circle cx="163" cy="356" r="14" fill="#a32734" stroke="none"/></g><g stroke="#a32734" stroke-width="5" fill="none" stroke-linecap="round"><path d="M334 332C470 332 520 438 625 468"/><path d="M334 497C470 497 520 497 625 500"/><path d="M334 662C470 662 520 560 625 532"/></g><g filter="url(#s)"><circle cx="790" cy="500" r="205" fill="#fffaf4"/><circle cx="790" cy="500" r="155" fill="none" stroke="#c6b5aa" stroke-width="3" stroke-dasharray="9 13"/><circle cx="790" cy="443" r="58" fill="#24211f"/><path d="M668 612c28-84 81-123 122-123s94 39 122 123" fill="#24211f"/></g><g font-family="Arial,Helvetica,sans-serif" text-anchor="middle"><text x="790" y="754" font-size="28" font-weight="700" fill="#1e1b19">“I know what this person is like.”</text><text x="790" y="793" font-size="21" fill="#756a63">familiarity • expectations • imagined possibilities</text></g><path d="M1002 500h130" stroke="#1e1b19" stroke-width="6"/><path d="M1118 484l32 16-32 16" fill="#1e1b19"/><g filter="url(#s)"><rect x="1170" y="292" width="330" height="416" rx="38" fill="#862531"/><text x="1335" y="382" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="23" fill="#f8ece7" letter-spacing="2">NEW INFORMATION</text><text x="1335" y="492" font-family="Georgia,serif" text-anchor="middle" font-size="56" fill="#fff" font-weight="700">Dating news</text><path d="M1240 558h190" stroke="#f2aeb5" stroke-width="4"/><text x="1335" y="623" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="23" fill="#fff1ed">The old model no longer</text><text x="1335" y="658" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="23" fill="#fff1ed">fits as neatly.</text></g><g font-family="Arial,Helvetica,sans-serif"><text x="1110" y="806" font-size="24" font-weight="700" fill="#862531">UPDATE</text><text x="1224" y="806" font-size="23" fill="#342f2b">surprise · loss · jealousy · relief · nothing</text></g></svg>