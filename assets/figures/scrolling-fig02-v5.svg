<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">What different scrolling studies can actually tell us</title><desc id="d">A four-part evidence map distinguishing reward learning, habit, compulsive use, and brain imaging evidence.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f3ed"/><stop offset="1" stop-color="#e5e1da"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".1"/></filter></defs><rect width="1600" height="1000" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="90" y="112" font-size="34" font-weight="700" fill="#1d1b19" letter-spacing="3">NOT ALL “SCROLLING EVIDENCE” MEANS THE SAME THING</text><text x="90" y="162" font-size="24" fill="#69625d">Some studies explain behavior directly. Others only show association.</text></g><g transform="translate(110 300)" font-family="Arial,Helvetica,sans-serif"><g filter="url(#s)"><rect width="315" height="430" rx="34" fill="#31524a"/><text x="38" y="62" font-size="20" fill="#dbe7e2" letter-spacing="2">01</text><text x="38" y="120" font-size="34" fill="#fff" font-weight="700">Reward</text><text x="38" y="160" font-size="34" fill="#fff" font-weight="700">learning</text><path d="M38 205h235" stroke="#86a69d" stroke-width="3"/><text x="38" y="255" font-size="22" fill="#ecf4f1">Explains why novelty</text><text x="38" y="288" font-size="22" fill="#ecf4f1">can keep behavior going.</text><rect x="38" y="340" width="155" height="42" rx="21" fill="#e8f1ed"/><text x="115" y="368" text-anchor="middle" font-size="18" fill="#31524a" font-weight="700">MECHANISTIC</text></g><g transform="translate(350)" filter="url(#s)"><rect width="315" height="430" rx="34" fill="#667367"/><text x="38" y="62" font-size="20" fill="#e4ebe6" letter-spacing="2">02</text><text x="38" y="120" font-size="34" fill="#fff" font-weight="700">Habit</text><text x="38" y="160" font-size="34" fill="#fff" font-weight="700">formation</text><path d="M38 205h235" stroke="#aeb9ae" stroke-width="3"/><text x="38" y="255" font-size="22" fill="#f1f4f1">Explains why opening</text><text x="38" y="288" font-size="22" fill="#f1f4f1">can become automatic.</text><rect x="38" y="340" width="155" height="42" rx="21" fill="#eef1ed"/><text x="115" y="368" text-anchor="middle" font-size="18" fill="#59665a" font-weight="700">BEHAVIORAL</text></g><g transform="translate(700)" filter="url(#s)"><rect width="315" height="430" rx="34" fill="#9a765d"/><text x="38" y="62" font-size="20" fill="#f2e9e2" letter-spacing="2">03</text><text x="38" y="120" font-size="34" fill="#fff" font-weight="700">Compulsive</text><text x="38" y="160" font-size="34" fill="#fff" font-weight="700">use</text><path d="M38 205h235" stroke="#c8aa94" stroke-width="3"/><text x="38" y="255" font-size="22" fill="#fff5ef">Shows links with</text><text x="38" y="288" font-size="22" fill="#fff5ef">loss of control.</text><rect x="38" y="340" width="155" height="42" rx="21" fill="#f4e9e0"/><text x="115" y="368" text-anchor="middle" font-size="18" fill="#8e674d" font-weight="700">ASSOCIATIVE</text></g><g transform="translate(1050)" filter="url(#s)"><rect width="315" height="430" rx="34" fill="#922f39"/><text x="38" y="62" font-size="20" fill="#f8e4e1" letter-spacing="2">04</text><text x="38" y="120" font-size="34" fill="#fff" font-weight="700">Brain</text><text x="38" y="160" font-size="34" fill="#fff" font-weight="700">imaging</text><path d="M38 205h235" stroke="#c87880" stroke-width="3"/><text x="38" y="255" font-size="22" fill="#fff0ed">Can show correlates,</text><text x="38" y="288" font-size="22" fill="#fff0ed">not a “scrolling center.”</text><rect x="38" y="340" width="155" height="42" rx="21" fill="#f7dfdc"/><text x="115" y="368" text-anchor="middle" font-size="18" fill="#842934" font-weight="700">INDIRECT</text></g></g><g font-family="Arial,Helvetica,sans-serif"><text x="110" y="820" font-size="23" font-weight="700" fill="#31524a">More direct explanation</text><path d="M365 812h820" stroke="#a79c94" stroke-width="3"/><path d="M1175 797l30 15-30 15" fill="#a79c94"/><text x="1225" y="820" font-size="23" font-weight="700" fill="#922f39">More interpretive caution</text><text x="800" y="905" text-anchor="middle" font-size="23" fill="#5e5651">The best explanation usually combines these layers instead of treating one as the whole story.</text></g></svg>