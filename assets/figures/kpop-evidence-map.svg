<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Evidence behind the idol-dating explanation</title>
  <desc id="desc">A compact evidence matrix showing strong general evidence for parasocial relationships, moderate evidence for loss-like responses and K-pop social identity, and the open gap in controlled idol-dating experiments.</desc>
  <rect width="1600" height="900" fill="#f3f0e8"/>

  <text x="72" y="62" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4" fill="#11110f">FIG. 02 / EVIDENCE</text>
  <text x="72" y="112" font-family="Georgia,Times New Roman,serif" font-size="48" fill="#11110f">The explanation is strongest around the event — not at the event itself.</text>
  <text x="72" y="145" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6d6961">Four evidence layers. Only the final row would directly test idol dating announcements.</text>

  <line x1="72" y1="190" x2="1528" y2="190" stroke="#b9b4aa"/>

  <!-- headers -->
  <g font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.4" fill="#6e211b">
    <text x="86" y="235">EVIDENCE BASE</text>
    <text x="560" y="235">DIRECTLY SUPPORTS</text>
    <text x="1240" y="235">STATUS</text>
  </g>

  <!-- row rules -->
  <g stroke="#b9b4aa">
    <line x1="72" y1="260" x2="1528" y2="260"/>
    <line x1="72" y1="385" x2="1528" y2="385"/>
    <line x1="72" y1="510" x2="1528" y2="510"/>
    <line x1="72" y1="635" x2="1528" y2="635"/>
    <line x1="72" y1="760" x2="1528" y2="760"/>
  </g>

  <!-- row 1 -->
  <g transform="translate(0 260)">
    <text x="86" y="43" font-family="Georgia,Times New Roman,serif" font-size="29" fill="#11110f">Parasocial relationships</text>
    <text x="86" y="76" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6d6961">Meta-analysis · 120 studies</text>
    <text x="560" y="49" font-family="Georgia,Times New Roman,serif" font-size="23" fill="#11110f">One-sided relationships can be psychologically meaningful.</text>
    <circle cx="1248" cy="52" r="9" fill="#11110f"/>
    <text x="1270" y="57" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#11110f">STRONG</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(0 385)">
    <text x="86" y="43" font-family="Georgia,Times New Roman,serif" font-size="29" fill="#11110f">Parasocial disruption</text>
    <text x="86" y="76" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6d6961">Cohen · N=381 + later breakup literature</text>
    <text x="560" y="49" font-family="Georgia,Times New Roman,serif" font-size="23" fill="#11110f">Stronger bonds predict greater loss-like distress.</text>
    <circle cx="1248" cy="52" r="9" fill="#6e211b"/>
    <text x="1270" y="57" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#6e211b">MODERATE</text>
  </g>

  <!-- row 3 -->
  <g transform="translate(0 510)">
    <text x="86" y="43" font-family="Georgia,Times New Roman,serif" font-size="29" fill="#11110f">K-pop fandom identity</text>
    <text x="86" y="76" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6d6961">International K-pop sample · N=1,477 · 92 countries</text>
    <text x="560" y="49" font-family="Georgia,Times New Roman,serif" font-size="23" fill="#11110f">Fandom can function as a social identity, not just a dyadic bond.</text>
    <circle cx="1248" cy="52" r="9" fill="#6e211b"/>
    <text x="1270" y="57" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#6e211b">MODERATE</text>
  </g>

  <!-- row 4 -->
  <g transform="translate(0 635)">
    <text x="86" y="43" font-family="Georgia,Times New Roman,serif" font-size="29" fill="#6e211b">Idol dating announcement</text>
    <text x="86" y="76" font-family="Helvetica,Arial,sans-serif" font-size="12" fill="#6e211b">Controlled comparison: dating vs friendship vs hiatus vs neutral</text>
    <text x="560" y="49" font-family="Georgia,Times New Roman,serif" font-size="23" fill="#11110f">Would isolate model violation, romantic interest and identity threat.</text>
    <line x1="1236" y1="52" x2="1260" y2="52" stroke="#6e211b" stroke-width="2" stroke-dasharray="5 5"/>
    <text x="1270" y="57" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.6" fill="#6e211b">OPEN</text>
  </g>

  <!-- footer -->
  <rect x="72" y="790" width="1456" height="70" fill="#11110f"/>
  <text x="98" y="820" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.5" fill="#f3f0e8">READING RULE</text>
  <text x="98" y="846" font-family="Georgia,Times New Roman,serif" font-size="21" fill="#f3f0e8">Strong adjacent evidence does not equal a direct K-pop-specific mechanism test.</text>
</svg>
