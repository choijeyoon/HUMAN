<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 940" role="img" aria-labelledby="title desc">
  <title id="title">Evidence map for the idol-dating flagship</title>
  <desc id="desc">A study-by-study map separating general parasocial evidence, parasocial loss, K-pop social-media and identity evidence, and the still-open need for a controlled idol-dating experiment.</desc>
  <rect width="1800" height="940" fill="#f3f0e8"/>

  <g fill="#11110f">
    <text x="78" y="70" font-family="Helvetica,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="4">FIG. 02 / EVIDENCE DIRECTNESS MAP</text>
    <text x="78" y="120" font-family="Georgia,Times New Roman,serif" font-size="48">What has actually been tested?</text>
    <text x="78" y="153" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#66625b">The dating-news mechanism is assembled from adjacent literatures; directness is not the same as evidence quality.</text>
  </g>

  <g stroke="#aaa69c" stroke-width="1">
    <line x1="78" y1="205" x2="1722" y2="205"/>
    <line x1="78" y1="270" x2="1722" y2="270"/>
    <line x1="78" y1="390" x2="1722" y2="390"/>
    <line x1="78" y1="510" x2="1722" y2="510"/>
    <line x1="78" y1="630" x2="1722" y2="630"/>
    <line x1="78" y1="750" x2="1722" y2="750"/>
    <line x1="78" y1="835" x2="1722" y2="835"/>
    <line x1="395" y1="205" x2="395" y2="835"/>
    <line x1="700" y1="205" x2="700" y2="835"/>
    <line x1="1110" y1="205" x2="1110" y2="835"/>
    <line x1="1470" y1="205" x2="1470" y2="835"/>
  </g>

  <g font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2.3" fill="#6e211b">
    <text x="78" y="245">EVIDENCE DOMAIN</text>
    <text x="420" y="245">STUDY / SAMPLE</text>
    <text x="725" y="245">WHAT IT DIRECTLY SUPPORTS</text>
    <text x="1135" y="245">RELATION TO DATING NEWS</text>
    <text x="1495" y="245">STATUS</text>
  </g>

  <!-- row 1 -->
  <g transform="translate(0 270)">
    <text x="78" y="45" font-family="Georgia,Times New Roman,serif" font-size="27" fill="#11110f">Parasocial core</text>
    <text x="78" y="76" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.3" fill="#66625b">GENERAL MEDIA RELATIONSHIPS</text>
    <text x="420" y="43" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#11110f">Tukachinsky et al. 2020</text>
    <text x="420" y="73" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#66625b">Meta-analysis · 120 studies</text>
    <text x="725" y="42" font-family="Georgia,Times New Roman,serif" font-size="21" fill="#11110f">PSRs are heterogeneous social bonds;</text>
    <text x="725" y="70" font-family="Georgia,Times New Roman,serif" font-size="21" fill="#11110f">not simply products of social deficiency.</text>
    <text x="1135" y="43" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#11110f">FOUNDATIONAL / INDIRECT</text>
    <circle cx="1510" cy="48" r="8" fill="#11110f"/><text x="1532" y="53" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#11110f">STRONG</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(0 390)">
    <text x="78" y="45" font-family="Georgia,Times New Roman,serif" font-size="27" fill="#11110f">Parasocial loss</text>
    <text x="78" y="76" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.3" fill="#66625b">BREAKUP ANALOGUE</text>
    <text x="420" y="43" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#11110f">Cohen 2004</text>
    <text x="420" y="73" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#66625b">Adults · N=381</text>
    <text x="725" y="42" font-family="Georgia,Times New Roman,serif" font-size="21" fill="#11110f">Stronger PSRs predict more anticipated</text>
    <text x="725" y="70" font-family="Georgia,Times New Roman,serif" font-size="21" fill="#11110f">distress when access to a figure ends.</text>
    <text x="1135" y="43" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#11110f">CLOSEST LOSS ANALOGUE</text>
    <circle cx="1510" cy="48" r="8" fill="#6e211b"/><text x="1532" y="53" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6e211b">MODERATE</text>
  </g>

  <!-- row 3 -->
  <g transform="translate(0 510)">
    <text x="78" y="45" font-family="Georgia,Times New Roman,serif" font-size="27" fill="#11110f">K-pop media context</text>
    <text x="78" y="76" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.3" fill="#66625b">SOCIAL MEDIA × PSR</text>
    <text x="420" y="43" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#11110f">Chung &amp; Cho 2017</text>
    <text x="420" y="73" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#66625b">Korean Wave fans · N=400</text>
    <text x="725" y="42" font-family="Georgia,Times New Roman,serif" font-size="21" fill="#11110f">Social-media affordances and self-disclosure</text>
    <text x="725" y="70" font-family="Georgia,Times New Roman,serif" font-size="21" fill="#11110f">relate to celebrity–fan engagement.</text>
    <text x="1135" y="43" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#11110f">K-POP CONTEXT / NOT DATING</text>
    <circle cx="1510" cy="48" r="8" fill="#6e211b"/><text x="1532" y="53" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6e211b">CONTEXT</text>
  </g>

  <!-- row 4 -->
  <g transform="translate(0 630)">
    <text x="78" y="45" font-family="Georgia,Times New Roman,serif" font-size="27" fill="#11110f">K-pop identity</text>
    <text x="78" y="76" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.3" fill="#66625b">FANSHIP × SOCIAL IDENTITY</text>
    <text x="420" y="43" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#11110f">Laffan 2021</text>
    <text x="420" y="73" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#66625b">K-pop fans · N=1,477 · 92 countries</text>
    <text x="725" y="42" font-family="Georgia,Times New Roman,serif" font-size="21" fill="#11110f">Fandom can function as a social identity</text>
    <text x="725" y="70" font-family="Georgia,Times New Roman,serif" font-size="21" fill="#11110f">linked to community-level outcomes.</text>
    <text x="1135" y="43" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#11110f">GROUP-LEVEL CONTEXT</text>
    <circle cx="1510" cy="48" r="8" fill="#6e211b"/><text x="1532" y="53" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6e211b">MODERATE</text>
  </g>

  <!-- row 5 open -->
  <g transform="translate(0 750)">
    <text x="78" y="45" font-family="Georgia,Times New Roman,serif" font-size="27" fill="#6e211b">Idol dating announcement</text>
    <text x="78" y="76" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.3" fill="#6e211b">CONTROLLED MECHANISM TEST</text>
    <text x="420" y="45" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#11110f">Needed experiment</text>
    <text x="420" y="74" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#66625b">Dating vs friendship vs hiatus vs neutral update</text>
    <text x="725" y="42" font-family="Georgia,Times New Roman,serif" font-size="21" fill="#11110f">Would separate romantic interest, model violation,</text>
    <text x="725" y="70" font-family="Georgia,Times New Roman,serif" font-size="21" fill="#11110f">identity threat and parasocial loss.</text>
    <text x="1135" y="43" font-family="Helvetica,Arial,sans-serif" font-size="14" fill="#6e211b">DIRECT TEST</text>
    <line x1="1500" y1="48" x2="1522" y2="48" stroke="#6e211b" stroke-width="2" stroke-dasharray="5 5"/><text x="1535" y="53" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#6e211b">OPEN</text>
  </g>

  <text x="78" y="887" font-family="Georgia,Times New Roman,serif" font-size="27" fill="#11110f">No row above establishes a K-pop-specific neural “prediction-error signature.”</text>
  <text x="78" y="916" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#66625b">SAMPLE SIZE IS SHOWN FOR STUDY IDENTIFICATION; COLUMN WIDTH, DOT SIZE AND ROW POSITION DO NOT REPRESENT EFFECT SIZE.</text>
</svg>
