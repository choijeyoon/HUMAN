<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="t d"><title id="t">Evidence ladder for AI relationships</title><desc id="d">Evidence is strongest for short-term connection and weaker for long-term wellbeing and durable attachment.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f7f3ec"/><stop offset="1" stop-color="#e9e3dd"/></linearGradient><linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2e5b56"/><stop offset=".6" stop-color="#8e6e58"/><stop offset="1" stop-color="#9a2f39"/></linearGradient></defs><rect width="1600" height="1000" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif"><text x="90" y="112" font-size="34" font-weight="700" fill="#1c1b19" letter-spacing="3">THE EVIDENCE GETS THINNER WITH TIME</text><text x="90" y="162" font-size="24" fill="#67605b">We can test instant connection more easily than durable relationship effects.</text></g><rect x="140" y="270" width="1320" height="22" rx="11" fill="url(#bar)" opacity=".22"/><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(250 360)"><circle r="105" fill="#2e5b56"/><text text-anchor="middle" y="-12" font-size="24" fill="#fff" font-weight="700">IMMEDIATE</text><text text-anchor="middle" y="22" font-size="24" fill="#fff" font-weight="700">CONNECTION</text><text text-anchor="middle" y="145" font-size="20" fill="#3f4e4a">lab experiments</text><text text-anchor="middle" y="175" font-size="20" fill="#3f4e4a">strongest evidence</text></g><g transform="translate(610 490)"><circle r="105" fill="#57756c"/><text text-anchor="middle" y="-12" font-size="24" fill="#fff" font-weight="700">PERCEIVED</text><text text-anchor="middle" y="22" font-size="24" fill="#fff" font-weight="700">CLOSENESS</text><text text-anchor="middle" y="145" font-size="20" fill="#4c514f">randomized designs</text><text text-anchor="middle" y="175" font-size="20" fill="#4c514f">promising</text></g><g transform="translate(970 620)"><circle r="105" fill="#9b765d"/><text text-anchor="middle" y="-12" font-size="24" fill="#fff" font-weight="700">REAL-WORLD</text><text text-anchor="middle" y="22" font-size="24" fill="#fff" font-weight="700">USE</text><text text-anchor="middle" y="145" font-size="20" fill="#5a4d46">observational data</text><text text-anchor="middle" y="175" font-size="20" fill="#5a4d46">mixed questions</text></g><g transform="translate(1330 750)"><circle r="105" fill="#922f39"/><text text-anchor="middle" y="-12" font-size="24" fill="#fff" font-weight="700">LONG-TERM</text><text text-anchor="middle" y="22" font-size="24" fill="#fff" font-weight="700">WELLBEING</text><text text-anchor="middle" y="145" font-size="20" fill="#65514f">still unresolved</text><text text-anchor="middle" y="175" font-size="20" fill="#65514f">needs longitudinal tests</text></g></g><g stroke="#9f9187" stroke-width="5" fill="none" stroke-linecap="round"><path d="M355 395C440 390 485 420 520 448"/><path d="M715 525C800 540 850 570 885 595"/><path d="M1075 655C1160 680 1200 708 1235 732"/></g><g font-family="Arial,Helvetica,sans-serif"><text x="145" y="900" font-size="22" font-weight="700" fill="#2e5b56">More controlled</text><text x="1260" y="900" font-size="22" font-weight="700" fill="#922f39">More uncertain</text><path d="M325 893h880" stroke="#a99c92" stroke-width="3"/><path d="M1190 878l30 15-30 15" fill="#a99c92"/></g></svg>