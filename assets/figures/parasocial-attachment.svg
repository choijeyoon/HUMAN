<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1080" role="img" aria-labelledby="title desc">
  <title id="title">From mediated exposure to social-model updating</title>
  <desc id="desc">An evidence-led conceptual synthesis showing media streams feeding a layered internal social model, an unexpected dating-news event perturbing expectations, and multiple possible responses. Evidence anchors are labeled separately from mechanistic inference.</desc>
  <rect width="1800" height="1080" fill="#f3f0e8"/>

  <g fill="#11110f" font-family="Helvetica,Arial,sans-serif">
    <text x="82" y="72" font-size="15" font-weight="700" letter-spacing="4">FIG. 01 / MEDIATED INTIMACY AS MODEL FORMATION</text>
    <text x="82" y="118" font-family="Georgia,Times New Roman,serif" font-size="50" letter-spacing="-1">From repeated exposure to expectation update.</text>
    <text x="82" y="151" font-size="14" fill="#6d6961">Evidence-supported ingredients are separated from the proposed dating-news update mechanism.</text>
  </g>

  <!-- evidence key -->
  <g transform="translate(1245 76)" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.6" fill="#5f5b54">
    <circle cx="0" cy="0" r="5" fill="#11110f"/><text x="16" y="4">ESTABLISHED / DIRECT</text>
    <circle cx="190" cy="0" r="5" fill="#6e211b"/><text x="206" y="4">MODERATE</text>
    <line x1="330" y1="0" x2="354" y2="0" stroke="#6e211b" stroke-width="2" stroke-dasharray="5 5"/><text x="365" y="4">INFERENCE</text>
  </g>

  <!-- structural rules -->
  <g stroke="#b5b0a6" stroke-width="1">
    <line x1="82" y1="205" x2="1718" y2="205"/>
    <line x1="82" y1="840" x2="1718" y2="840"/>
  </g>

  <!-- LEFT: exposure field -->
  <g font-family="Helvetica,Arial,sans-serif">
    <text x="86" y="250" font-size="13" font-weight="700" letter-spacing="3" fill="#6e211b">01 / EXPOSURE FIELD</text>
    <text x="86" y="284" font-family="Georgia,Times New Roman,serif" font-size="27" fill="#11110f">Social information arrives as a stream,</text>
    <text x="86" y="315" font-family="Georgia,Times New Roman,serif" font-size="27" fill="#11110f">not as a single encounter.</text>
  </g>

  <g transform="translate(86 370)" stroke="#11110f" fill="none">
    <g opacity=".92">
      <line x1="0" y1="0" x2="355" y2="0" stroke-width="2"/><circle cx="56" cy="0" r="5" fill="#11110f"/><circle cx="142" cy="0" r="3" fill="#11110f"/><circle cx="265" cy="0" r="4" fill="#11110f"/>
      <line x1="0" y1="24" x2="305" y2="24"/><circle cx="100" cy="24" r="3" fill="#11110f"/><circle cx="234" cy="24" r="4" fill="#11110f"/>
      <line x1="0" y1="48" x2="385" y2="48"/><circle cx="42" cy="48" r="3" fill="#11110f"/><circle cx="174" cy="48" r="4" fill="#11110f"/><circle cx="328" cy="48" r="3" fill="#11110f"/>
    </g>
    <g transform="translate(0 126)" opacity=".78" stroke="#6e211b">
      <line x1="0" y1="0" x2="328" y2="0" stroke-width="2"/><circle cx="78" cy="0" r="5" fill="#6e211b"/><circle cx="212" cy="0" r="3" fill="#6e211b"/>
      <line x1="0" y1="24" x2="372" y2="24"/><circle cx="130" cy="24" r="4" fill="#6e211b"/><circle cx="298" cy="24" r="3" fill="#6e211b"/>
      <line x1="0" y1="48" x2="290" y2="48"/><circle cx="46" cy="48" r="3" fill="#6e211b"/><circle cx="194" cy="48" r="4" fill="#6e211b"/>
    </g>
    <g transform="translate(0 252)" opacity=".62">
      <line x1="0" y1="0" x2="370" y2="0"/><circle cx="92" cy="0" r="4" fill="#11110f"/><circle cx="246" cy="0" r="3" fill="#11110f"/>
      <line x1="0" y1="24" x2="315" y2="24"/><circle cx="156" cy="24" r="3" fill="#11110f"/>
      <line x1="0" y1="48" x2="395" y2="48"/><circle cx="54" cy="48" r="3" fill="#11110f"/><circle cx="280" cy="48" r="4" fill="#11110f"/>
    </g>
  </g>

  <g font-family="Helvetica,Arial,sans-serif" fill="#5f5b54" font-size="13" letter-spacing="1.1">
    <text x="86" y="455">REPEATED EXPOSURE · face · voice · narrative continuity</text>
    <text x="86" y="581">INTIMACY CUES · direct address · self-disclosure · access</text>
    <text x="86" y="707">COMMUNITY CONTEXT · shared rituals · fan discourse · norms</text>
  </g>

  <!-- flows into model -->
  <g fill="none" stroke="#6e211b" stroke-width="2">
    <path d="M470 395 C565 395 598 430 678 453"/>
    <path d="M470 520 C570 520 596 510 682 510"/>
    <path d="M470 645 C570 645 604 592 688 568"/>
  </g>
  <g fill="#6e211b">
    <path d="M682 453l-13-6 2 14z"/><path d="M682 510l-13-6v12z"/><path d="M688 568l-13-3 5 13z"/>
  </g>

  <!-- MIDDLE: layered social model -->
  <g font-family="Helvetica,Arial,sans-serif">
    <text x="650" y="250" font-size="13" font-weight="700" letter-spacing="3" fill="#6e211b">02 / INTERNAL SOCIAL MODEL</text>
  </g>

  <g transform="translate(910 515)" fill="none">
    <ellipse rx="270" ry="220" stroke="#aaa69c" stroke-width="1"/>
    <ellipse rx="218" ry="173" stroke="#827e76" stroke-width="1.3"/>
    <ellipse rx="165" ry="126" stroke="#6e211b" stroke-width="1.8"/>
    <ellipse rx="108" ry="80" stroke="#11110f" stroke-width="2.2"/>
  </g>
  <g text-anchor="middle" font-family="Georgia,Times New Roman,serif" fill="#11110f">
    <text x="910" y="506" font-size="31">PERSON MODEL</text>
    <text x="910" y="540" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="2.2" fill="#6d6961">ASYMMETRIC · INFORMATION-RICH</text>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.6" fill="#5f5b54">
    <text x="855" y="410">FAMILIARITY</text>
    <text x="1027" y="452">PERCEIVED INTIMACY</text>
    <text x="1024" y="602">EXPECTATION</text>
    <text x="790" y="684">FANDOM IDENTITY</text>
  </g>
  <g font-family="Georgia,Times New Roman,serif" fill="#11110f">
    <text x="690" y="772" font-size="22">The model can be meaningful without being reciprocal.</text>
  </g>

  <!-- RIGHT: perturbation and response field -->
  <g font-family="Helvetica,Arial,sans-serif">
    <text x="1244" y="250" font-size="13" font-weight="700" letter-spacing="3" fill="#6e211b">03 / EVENT PERTURBATION</text>
  </g>
  <line x1="1284" y1="314" x2="1284" y2="725" stroke="#11110f" stroke-width="2.2"/>
  <circle cx="1284" cy="515" r="10" fill="#6e211b"/>
  <g font-family="Georgia,Times New Roman,serif" fill="#11110f">
    <text x="1320" y="355" font-size="32">Dating news</text>
    <text x="1320" y="386" font-family="Helvetica,Arial,sans-serif" font-size="13" letter-spacing="1.2" fill="#5f5b54">UNEXPECTED SOCIAL INFORMATION</text>
    <text x="1320" y="478" font-size="29">Expectation must update.</text>
  </g>
  <path d="M1180 515 H1260" stroke="#6e211b" stroke-width="2.4" stroke-dasharray="8 8"/>
  <path d="M1260 515l-13-7v14z" fill="#6e211b"/>
  <g font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#6e211b">
    <text x="1164" y="497" text-anchor="end">PROPOSED MODEL-UPDATE LINK</text>
    <text x="1164" y="518" text-anchor="end">INFERENCE, NOT DIRECT NEURAL EVIDENCE</text>
  </g>

  <!-- response branches -->
  <g fill="none" stroke="#9a958b" stroke-width="1.4">
    <path d="M1284 550 C1370 550 1376 542 1436 542"/>
    <path d="M1284 575 C1375 575 1400 595 1470 595"/>
    <path d="M1284 600 C1370 600 1370 650 1438 650"/>
    <path d="M1284 625 C1378 625 1410 705 1486 705"/>
  </g>
  <g font-family="Georgia,Times New Roman,serif" fill="#11110f" font-size="24">
    <text x="1450" y="548">disappointment · jealousy</text>
    <text x="1482" y="601">withdrawal · acceptance</text>
    <text x="1450" y="656">identity defence</text>
    <text x="1498" y="711">model revision</text>
  </g>
  <text x="1450" y="752" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.4" fill="#5f5b54">POSSIBLE RESPONSES · NOT SCALED</text>

  <!-- evidence anchors -->
  <g font-family="Helvetica,Arial,sans-serif">
    <text x="82" y="890" font-size="13" font-weight="700" letter-spacing="3" fill="#6e211b">EVIDENCE ANCHORS</text>
  </g>
  <g stroke="#b5b0a6" stroke-width="1">
    <line x1="82" y1="915" x2="1718" y2="915"/>
    <line x1="480" y1="915" x2="480" y2="1000"/>
    <line x1="880" y1="915" x2="880" y2="1000"/>
    <line x1="1280" y1="915" x2="1280" y2="1000"/>
  </g>
  <g font-family="Georgia,Times New Roman,serif" fill="#11110f">
    <text x="82" y="950" font-size="20">Parasocial core</text>
    <text x="480" y="950" font-size="20" transform="translate(28 0)">Breakup analogue</text>
    <text x="880" y="950" font-size="20" transform="translate(28 0)">K-pop identity</text>
    <text x="1280" y="950" font-size="20" transform="translate(28 0)">Dating-specific test</text>
  </g>
  <g font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.2" fill="#5f5b54">
    <text x="82" y="980">META-ANALYSIS · 120 STUDIES · STRONG</text>
    <text x="508" y="980">N=381 · MODERATE / INDIRECT</text>
    <text x="908" y="980">N=1,477 · 92 COUNTRIES · MODERATE</text>
    <text x="1308" y="980" fill="#6e211b">CONTROLLED TEST · OPEN</text>
  </g>

  <text x="82" y="1040" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#6d6961">CONCEPTUAL SYNTHESIS — RING SIZE, FLOW WIDTH AND RESPONSE POSITION DO NOT REPRESENT EFFECT SIZE.</text>
</svg>
