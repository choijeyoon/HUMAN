<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">How mediated intimacy becomes an expectation model</title>
  <desc id="desc">A minimal conceptual figure showing repeated media exposure building a layered social model, followed by an unexpected dating announcement that forces expectation updating. Fandom identity is shown as a modifier rather than a separate causal pathway.</desc>
  <rect width="1600" height="900" fill="#f3f0e8"/>

  <g font-family="Helvetica,Arial,sans-serif" fill="#11110f">
    <text x="72" y="62" font-size="15" font-weight="700" letter-spacing="4">FIG. 01 / MECHANISM</text>
    <text x="72" y="112" font-family="Georgia,Times New Roman,serif" font-size="48">A one-sided bond can still build expectations.</text>
    <text x="72" y="145" font-size="14" fill="#6d6961">Conceptual synthesis · the dating-news update link remains an inference, not a demonstrated neural mechanism.</text>
  </g>

  <line x1="72" y1="190" x2="1528" y2="190" stroke="#b9b4aa"/>

  <!-- 1. media stream -->
  <g transform="translate(90 290)">
    <text x="0" y="0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#6e211b">01 / MEDIATED EXPOSURE</text>
    <g transform="translate(0 58)" stroke="#11110f" fill="#11110f">
      <line x1="0" y1="0" x2="310" y2="0" stroke-width="2"/><circle cx="62" cy="0" r="5"/><circle cx="170" cy="0" r="4"/><circle cx="275" cy="0" r="5"/>
      <line x1="0" y1="40" x2="272" y2="40" stroke-width="1.2"/><circle cx="95" cy="40" r="4"/><circle cx="222" cy="40" r="4"/>
      <line x1="0" y1="80" x2="326" y2="80" stroke-width="1.2"/><circle cx="45" cy="80" r="4"/><circle cx="145" cy="80" r="3"/><circle cx="300" cy="80" r="4"/>
    </g>
    <text x="0" y="182" font-family="Georgia,Times New Roman,serif" font-size="29" fill="#11110f">Repeated contact</text>
    <text x="0" y="214" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6d6961">face · voice · direct address · narrative continuity</text>
  </g>

  <!-- flow -->
  <path d="M425 435 C500 435 525 435 585 435" fill="none" stroke="#6e211b" stroke-width="2.5"/>
  <path d="M585 435l-13-7v14z" fill="#6e211b"/>

  <!-- 2. social model -->
  <g transform="translate(790 435)">
    <text x="-190" y="-145" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#6e211b">02 / INTERNAL SOCIAL MODEL</text>
    <circle r="132" fill="none" stroke="#b9b4aa" stroke-width="1.2"/>
    <circle r="96" fill="none" stroke="#6e211b" stroke-width="1.8"/>
    <circle r="58" fill="#11110f"/>
    <text x="0" y="-8" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="24" fill="#f3f0e8">PERSON</text>
    <text x="0" y="20" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="2" fill="#f3f0e8">MODEL</text>
    <text x="0" y="-108" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="2" fill="#6d6961">FAMILIARITY</text>
    <text x="0" y="-76" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="2" fill="#6e211b">PERCEIVED INTIMACY</text>
    <text x="0" y="118" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="2" fill="#6d6961">EXPECTATION</text>
  </g>

  <!-- fandom modifier -->
  <g transform="translate(650 645)">
    <rect width="280" height="74" rx="37" fill="none" stroke="#11110f"/>
    <text x="140" y="29" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#6e211b">MODIFIER</text>
    <text x="140" y="53" text-anchor="middle" font-family="Georgia,Times New Roman,serif" font-size="20" fill="#11110f">Fandom identity</text>
  </g>
  <path d="M790 645V583" stroke="#11110f" stroke-width="1.2" stroke-dasharray="5 6"/>

  <!-- 3. event -->
  <path d="M955 435H1080" stroke="#6e211b" stroke-width="2.5" stroke-dasharray="8 7"/>
  <path d="M1080 435l-13-7v14z" fill="#6e211b"/>
  <g transform="translate(1135 300)">
    <text x="0" y="0" font-family="Helvetica,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#6e211b">03 / UNEXPECTED UPDATE</text>
    <line x1="0" y1="45" x2="0" y2="310" stroke="#11110f" stroke-width="2"/>
    <circle cx="0" cy="135" r="9" fill="#6e211b"/>
    <text x="36" y="92" font-family="Georgia,Times New Roman,serif" font-size="34" fill="#11110f">Dating news</text>
    <text x="36" y="124" font-family="Helvetica,Arial,sans-serif" font-size="12" letter-spacing="1.5" fill="#6d6961">NEW SOCIAL INFORMATION</text>
    <text x="36" y="190" font-family="Georgia,Times New Roman,serif" font-size="31" fill="#11110f">Expectation updates.</text>
    <text x="36" y="235" font-family="Helvetica,Arial,sans-serif" font-size="13" fill="#6d6961">Possible responses differ:</text>
    <text x="36" y="270" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#11110f">disappointment · jealousy</text>
    <text x="36" y="300" font-family="Georgia,Times New Roman,serif" font-size="22" fill="#11110f">acceptance · withdrawal · revision</text>
  </g>

  <!-- takeaway -->
  <line x1="72" y1="790" x2="1528" y2="790" stroke="#b9b4aa"/>
  <text x="72" y="838" font-family="Georgia,Times New Roman,serif" font-size="30" fill="#11110f">Core claim: the emotion may reflect a model changing — not a literal reciprocal relationship ending.</text>
  <text x="72" y="872" font-family="Helvetica,Arial,sans-serif" font-size="11" letter-spacing="1.5" fill="#6d6961">CONCEPTUAL FIGURE · SHAPE, DISTANCE AND LINE WIDTH DO NOT REPRESENT EFFECT SIZE.</text>
</svg>
