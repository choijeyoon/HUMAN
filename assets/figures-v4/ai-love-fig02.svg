<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img">
<defs>
 <linearGradient id="rosefade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b1d2b"/><stop offset="1" stop-color="#d5a3a0"/></linearGradient>
 <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5ede1"/><stop offset="1" stop-color="#e3c8bd"/></linearGradient>
 <linearGradient id="darkgrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#111218"/><stop offset="1" stop-color="#26151a"/></linearGradient>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".14"/></filter>
</defs>
<rect width="1200" height="800" fill="#f4efe5"/>
<text x="600" y="72" fill="#171717" text-anchor="middle" font-family="Georgia" font-size="44" font-weight="600" letter-spacing="0">What the Evidence Tells Us</text><text x="600" y="108" fill="#171717" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" letter-spacing="0.5">Different studies answer different questions</text><text x="95" y="180" fill="#6d6a66" text-anchor="start" font-family="Arial" font-size="18" font-weight="700" letter-spacing="1.4">FROM QUICK CONNECTION</text><text x="1095" y="180" fill="#6d6a66" text-anchor="end" font-family="Arial" font-size="18" font-weight="700" letter-spacing="1.4">TO LONG-TERM WELL-BEING</text><rect x="90" y="575" width="225" height="125" rx="8" fill="#f0dfd2" filter="url(#shadow)"/><text x="108" y="611" fill="#781d2a" text-anchor="start" font-family="Arial" font-size="18" font-weight="700">1</text><text x="108" y="645" fill="#171717" font-family="Georgia" font-size="18" font-weight="600">First impressions</text><text x="108" y="679" fill="#6d6a66" font-family="Arial" font-size="13.5">Short experiments show</text><text x="108" y="701" fill="#6d6a66" font-family="Arial" font-size="13.5">connection can happen quickly.</text><circle cx="112" cy="676" r="6.5" fill="#781d2a"/><circle cx="134" cy="676" r="6.5" fill="#781d2a"/><circle cx="156" cy="676" r="6.5" fill="#781d2a"/><circle cx="178" cy="676" r="6.5" fill="#781d2a"/><rect x="325" y="495" width="225" height="205" rx="8" fill="#f0dfd2" filter="url(#shadow)"/><text x="343" y="531" fill="#781d2a" font-family="Arial" font-size="18" font-weight="700">2</text><text x="343" y="565" fill="#171717" font-family="Georgia" font-size="18" font-weight="600">Building closeness</text><text x="343" y="599" fill="#6d6a66" font-family="Arial" font-size="13.5">Randomized studies show AI</text><text x="343" y="621" fill="#6d6a66" font-family="Arial" font-size="13.5">can foster meaningful closeness.</text><circle cx="347" cy="676" r="6.5" fill="#781d2a"/><circle cx="369" cy="676" r="6.5" fill="#781d2a"/><circle cx="391" cy="676" r="6.5" fill="#781d2a"/><circle cx="413" cy="676" r="6.5" fill="#781d2a"/><rect x="560" y="405" width="225" height="295" rx="8" fill="#f0dfd2" filter="url(#shadow)"/><text x="578" y="441" fill="#781d2a" font-family="Arial" font-size="18" font-weight="700">3</text><text x="578" y="475" fill="#171717" font-family="Georgia" font-size="18" font-weight="600">Lasting relationships</text><text x="578" y="509" fill="#6d6a66" font-family="Arial" font-size="13.5">Some evidence exists,</text><text x="578" y="531" fill="#6d6a66" font-family="Arial" font-size="13.5">but months-long data are thin.</text><circle cx="582" cy="676" r="6.5" fill="#781d2a"/><circle cx="604" cy="676" r="6.5" fill="#781d2a"/><circle cx="626" cy="676" r="6.5" fill="#781d2a"/><circle cx="648" cy="676" r="6.5" fill="none" stroke="#781d2a" stroke-width="2"/><rect x="795" y="290" width="315" height="410" rx="8" fill="#3c2025" filter="url(#shadow)"/><text x="813" y="326" fill="#f4dfd7" font-family="Arial" font-size="18" font-weight="700">4</text><text x="813" y="360" fill="white" font-family="Georgia" font-size="18" font-weight="600">Real-world well-being</text><text x="813" y="394" fill="#e5d5cf" font-family="Arial" font-size="13.5">Mental-health and life outcomes?</text><text x="813" y="416" fill="#e5d5cf" font-family="Arial" font-size="13.5">Still genuinely unclear.</text><circle cx="817" cy="676" r="6.5" fill="none" stroke="#e8c9c1" stroke-width="2"/><circle cx="839" cy="676" r="6.5" fill="none" stroke="#e8c9c1" stroke-width="2"/><circle cx="861" cy="676" r="6.5" fill="none" stroke="#e8c9c1" stroke-width="2"/><circle cx="883" cy="676" r="6.5" fill="none" stroke="#e8c9c1" stroke-width="2"/><path d="M150 235 C390 210 655 175 930 120" fill="none" stroke="#171717" stroke-width="3"/><path d="M910 115 L935 120 L917 138" fill="#171717"/><text x="580" y="755" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="16">Promising signals</text><text x="1040" y="755" fill="#781d2a" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700">The long game remains open</text>
</svg>