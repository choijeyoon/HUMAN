<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"><defs><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".14"/></filter></defs><rect width="1200" height="800" fill="#f4efe5"/><text x="600" y="72" fill="#171717" text-anchor="middle" font-family="Georgia" font-size="44" font-weight="600">What the Science Shows — So Far</text><text x="600" y="108" fill="#171717" text-anchor="middle" font-family="Arial" font-size="18">Not every claim about scrolling is equally strong</text><text x="160" y="145" fill="#6d6a66" font-family="Arial" font-size="15" font-weight="700" letter-spacing="1.5">WHAT WE KNOW</text><text x="745" y="145" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" letter-spacing="1.5">HOW STRONG?</text><text x="1100" y="145" fill="#6d6a66" text-anchor="end" font-family="Arial" font-size="15" font-weight="700" letter-spacing="1.5">WHAT IT MEANS</text><circle cx="105" cy="230" r="30" fill="#eee1d6" stroke="#ded6c9" stroke-width="2"/><text x="160" y="222" fill="#171717" font-family="Georgia" font-size="24" font-weight="600">Reward learning</text><text x="160" y="253" fill="#6d6a66" font-family="Arial" font-size="16">Behavior adapts to social rewards.</text><circle cx="675" cy="230" r="8.5" fill="#781d2a"/><circle cx="706" cy="230" r="8.5" fill="#781d2a"/><circle cx="737" cy="230" r="8.5" fill="#781d2a"/><circle cx="768" cy="230" r="8.5" fill="#781d2a"/><circle cx="799" cy="230" r="8.5" fill="#781d2a"/><text x="855" y="235" fill="#781d2a" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1">VERY STRONG</text><text x="1100" y="235" fill="#6d6a66" text-anchor="end" font-family="Arial" font-size="14">Replicated and causal</text><line x1="80" y1="290" x2="1120" y2="290" stroke="#d8d0c7"/><circle cx="105" cy="355" r="30" fill="#eee1d6" stroke="#ded6c9" stroke-width="2"/><text x="160" y="347" fill="#171717" font-family="Georgia" font-size="24" font-weight="600">Habit formation</text><text x="160" y="378" fill="#6d6a66" font-family="Arial" font-size="16">Repetition can automate behavior.</text><circle cx="675" cy="355" r="8.5" fill="#781d2a"/><circle cx="706" cy="355" r="8.5" fill="#781d2a"/><circle cx="737" cy="355" r="8.5" fill="#781d2a"/><circle cx="768" cy="355" r="8.5" fill="#781d2a"/><circle cx="799" cy="355" r="8.5" fill="#f4efe5" stroke="#aaa099" stroke-width="2"/><text x="855" y="360" fill="#781d2a" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1">STRONG</text><text x="1100" y="360" fill="#6d6a66" text-anchor="end" font-family="Arial" font-size="14">Strong, not universal</text><line x1="80" y1="415" x2="1120" y2="415" stroke="#d8d0c7"/><circle cx="105" cy="480" r="30" fill="#eee1d6" stroke="#ded6c9" stroke-width="2"/><text x="160" y="472" fill="#171717" font-family="Georgia" font-size="24" font-weight="600">Compulsive scrolling</text><text x="160" y="503" fill="#6d6a66" font-family="Arial" font-size="16">Linked to stress, sleep and well-being.</text><circle cx="675" cy="480" r="8.5" fill="#781d2a"/><circle cx="706" cy="480" r="8.5" fill="#781d2a"/><circle cx="737" cy="480" r="8.5" fill="#781d2a"/><circle cx="768" cy="480" r="8.5" fill="#f4efe5" stroke="#aaa099" stroke-width="2"/><circle cx="799" cy="480" r="8.5" fill="#f4efe5" stroke="#aaa099" stroke-width="2"/><text x="855" y="485" fill="#781d2a" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1">MODERATE</text><text x="1100" y="485" fill="#6d6a66" text-anchor="end" font-family="Arial" font-size="14">Direct, mostly observational</text><line x1="80" y1="540" x2="1120" y2="540" stroke="#d8d0c7"/><circle cx="105" cy="605" r="30" fill="#eee1d6" stroke="#ded6c9" stroke-width="2"/><text x="160" y="597" fill="#171717" font-family="Georgia" font-size="24" font-weight="600">Brain evidence</text><text x="160" y="628" fill="#6d6a66" font-family="Arial" font-size="16">Patterns exist; causality is not settled.</text><circle cx="675" cy="605" r="8.5" fill="#781d2a"/><circle cx="706" cy="605" r="8.5" fill="#781d2a"/><circle cx="737" cy="605" r="8.5" fill="#f4efe5" stroke="#aaa099" stroke-width="2"/><circle cx="768" cy="605" r="8.5" fill="#f4efe5" stroke="#aaa099" stroke-width="2"/><circle cx="799" cy="605" r="8.5" fill="#f4efe5" stroke="#aaa099" stroke-width="2"/><text x="855" y="610" fill="#781d2a" font-family="Arial" font-size="14" font-weight="700" letter-spacing="1">PRELIMINARY</text><text x="1100" y="610" fill="#6d6a66" text-anchor="end" font-family="Arial" font-size="14">Interesting, not mechanism-proof</text></svg>