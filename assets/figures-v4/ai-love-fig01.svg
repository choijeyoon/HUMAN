<rect width="1200" height="800" fill="url(#darkgrad)"/><text x="600" y="72" fill="#f7f2e8" text-anchor="middle" font-family="Georgia" font-size="44" font-weight="600" letter-spacing="0">When Does It Become “Love”?</text><text x="600" y="108" fill="#f7f2e8" text-anchor="middle" font-family="Arial" font-size="18" font-weight="400" letter-spacing="0.5">Human attachment can be real without proving machine consciousness</text><circle cx="175" cy="300" r="92" fill="#302329"/><path d="M62 690 C80 505 120 410 205 405 C290 410 330 505 350 690 Z" fill="#231b20"/><path d="M120 310 C145 210 230 190 270 260 C250 265 225 300 222 335 C190 338 150 330 120 310Z" fill="#0e0f14"/><path d="M925 190 C1030 190 1092 280 1065 390 C1040 475 970 505 910 470 C854 437 840 360 858 292 C872 240 895 210 925 190Z" fill="none" stroke="#d6a39a" stroke-width="4" opacity=".9"/><circle cx="938" cy="242" r="4" fill="#f3c7b9"/><circle cx="980" cy="278" r="3" fill="#f3c7b9"/><circle cx="918" cy="320" r="4" fill="#f3c7b9"/><circle cx="1008" cy="345" r="5" fill="#f3c7b9"/><circle cx="920" cy="405" r="3" fill="#f3c7b9"/><circle cx="974" cy="430" r="4" fill="#f3c7b9"/><circle cx="1040" cy="390" r="3" fill="#f3c7b9"/><circle cx="884" cy="350" r="3" fill="#f3c7b9"/><circle cx="954" cy="360" r="5" fill="#f3c7b9"/><circle cx="530" cy="210" r="30" fill="#781d2a"/><text x="530" y="219" fill="white" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" letter-spacing="0">1</text><text x="585" y="206" fill="#f5eee7" text-anchor="start" font-family="Arial" font-size="19" font-weight="700" letter-spacing="1.5">SYSTEM BEHAVIOR</text><text x="585" y="237" fill="#cfc4bd" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" letter-spacing="0">Words, memory, responsiveness</text><path d="M530 248 L530 287" stroke="#b87b79" stroke-width="3"/><path d="M520 277 L530 287 L540 277" fill="none" stroke="#b87b79" stroke-width="3"/><circle cx="530" cy="325" r="30" fill="#781d2a"/><text x="530" y="334" fill="white" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" letter-spacing="0">2</text><text x="585" y="321" fill="#f5eee7" text-anchor="start" font-family="Arial" font-size="19" font-weight="700" letter-spacing="1.5">PERCEIVED RESPONSIVENESS</text><text x="585" y="352" fill="#cfc4bd" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" letter-spacing="0">It feels attentive and caring</text><path d="M530 363 L530 402" stroke="#b87b79" stroke-width="3"/><path d="M520 392 L530 402 L540 392" fill="none" stroke="#b87b79" stroke-width="3"/><circle cx="530" cy="440" r="30" fill="#781d2a"/><text x="530" y="449" fill="white" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" letter-spacing="0">3</text><text x="585" y="436" fill="#f5eee7" text-anchor="start" font-family="Arial" font-size="19" font-weight="700" letter-spacing="1.5">HUMAN ATTACHMENT</text><text x="585" y="467" fill="#cfc4bd" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" letter-spacing="0">Closeness can become emotionally real</text><line x1="80" y1="570" x2="1120" y2="570" stroke="#bfa9a2" stroke-width="2" stroke-dasharray="8 8"/><text x="600" y="602" fill="#e8ddd4" text-anchor="middle" font-family="Arial" font-size="16" font-weight="600" letter-spacing="5">EPISTEMIC BOUNDARY</text><circle cx="530" cy="675" r="38" fill="none" stroke="#d9aaa2" stroke-width="3"/><text x="530" y="686" fill="#f3e7df" text-anchor="middle" font-family="Georgia" font-size="42" font-weight="600" letter-spacing="0">?</text><text x="585" y="663" fill="#f7efe9" text-anchor="start" font-family="Arial" font-size="20" font-weight="700" letter-spacing="0">4  MACHINE CONSCIOUSNESS?</text><text x="585" y="694" fill="#cfc4bd" text-anchor="start" font-family="Arial" font-size="20" font-weight="400" letter-spacing="0">A different question. No evidence yet.</text>
