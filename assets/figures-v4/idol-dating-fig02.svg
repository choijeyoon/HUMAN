<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"><defs><linearGradient id="rosefade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b1d2b"/><stop offset="1" stop-color="#d5a3a0"/></linearGradient><linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5ede1"/><stop offset="1" stop-color="#e3c8bd"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".14"/></filter></defs><rect width="1200" height="800" fill="#f4efe5"/><text x="600" y="72" fill="#171717" text-anchor="middle" font-family="Georgia" font-size="44" font-weight="600">What We Know (and Don’t)</text><text x="600" y="108" fill="#171717" text-anchor="middle" font-family="Arial" font-size="18">Evidence gets thinner as the claim becomes more specific</text><path d="M700 250 L1000 690 L420 690 Z" fill="#b7c0c0" opacity=".55"/><path d="M650 250 L750 410 L590 410 Z" fill="#e9d3c6"/><line x1="70" y1="410" x2="1120" y2="410" stroke="#9e9187" stroke-width="2"/><text x="90" y="270" fill="#171717" font-family="Georgia" font-size="24" font-weight="600">Parasocial relationship</text><text x="90" y="300" fill="#6d6a66" font-family="Arial" font-size="16">One-sided closeness is well established.</text><circle cx="470" cy="270" r="10" fill="#781d2a"/><circle cx="502" cy="270" r="10" fill="#781d2a"/><circle cx="534" cy="270" r="10" fill="#781d2a"/><circle cx="566" cy="270" r="10" fill="#781d2a"/><circle cx="598" cy="270" r="10" fill="#781d2a"/><text x="90" y="390" fill="#171717" font-family="Georgia" font-size="24" font-weight="600">Parasocial disruption</text><text x="90" y="420" fill="#6d6a66" font-family="Arial" font-size="16">Negative events can cause real distress.</text><circle cx="470" cy="390" r="10" fill="#781d2a"/><circle cx="502" cy="390" r="10" fill="#781d2a"/><circle cx="534" cy="390" r="10" fill="#781d2a"/><circle cx="566" cy="390" r="10" fill="#781d2a"/><circle cx="598" cy="390" r="10" fill="#f4efe5" stroke="#a79d95" stroke-width="2"/><text x="90" y="520" fill="#171717" font-family="Georgia" font-size="24" font-weight="600">K-pop fan identity</text><text x="90" y="550" fill="#6d6a66" font-family="Arial" font-size="16">Fandom can become part of who we are.</text><circle cx="470" cy="520" r="10" fill="#781d2a"/><circle cx="502" cy="520" r="10" fill="#781d2a"/><circle cx="534" cy="520" r="10" fill="#781d2a"/><circle cx="566" cy="520" r="10" fill="#f4efe5" stroke="#a79d95" stroke-width="2"/><circle cx="598" cy="520" r="10" fill="#f4efe5" stroke="#a79d95" stroke-width="2"/><text x="90" y="650" fill="#171717" font-family="Georgia" font-size="24" font-weight="600">Idol-dating specific tests</text><text x="90" y="680" fill="#6d6a66" font-family="Arial" font-size="16">Controlled causal evidence is still missing.</text><circle cx="470" cy="650" r="10" fill="#f4efe5" stroke="#a79d95" stroke-width="2"/><circle cx="502" cy="650" r="10" fill="#f4efe5" stroke="#a79d95" stroke-width="2"/><circle cx="534" cy="650" r="10" fill="#f4efe5" stroke="#a79d95" stroke-width="2"/><circle cx="566" cy="650" r="10" fill="#f4efe5" stroke="#a79d95" stroke-width="2"/><circle cx="598" cy="650" r="10" fill="#f4efe5" stroke="#a79d95" stroke-width="2"/><text x="650" y="655" fill="#781d2a" font-family="Arial" font-size="16" font-weight="700" letter-spacing="2">OPEN QUESTION</text><text x="930" y="115" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" letter-spacing="1.5">EVIDENCE STRENGTH</text><circle cx="850" cy="150" r="8" fill="#781d2a"/><text x="865" y="156" fill="#6d6a66" font-family="Arial" font-size="14">strong</text><circle cx="970" cy="150" r="8" fill="#c9868d"/><text x="985" y="156" fill="#6d6a66" font-family="Arial" font-size="14">moderate</text><circle cx="1090" cy="150" r="8" fill="#ded6c9"/><text x="1105" y="156" fill="#6d6a66" font-family="Arial" font-size="14">limited</text></svg>