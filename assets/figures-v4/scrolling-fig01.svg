<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"><defs><linearGradient id="rosefade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b1d2b"/><stop offset="1" stop-color="#d5a3a0"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".14"/></filter></defs><rect width="1200" height="800" fill="#f4efe5"/><text x="600" y="72" fill="#171717" text-anchor="middle" font-family="Georgia" font-size="44" font-weight="600">The Loop That Keeps You Scrolling</text><text x="600" y="108" fill="#171717" text-anchor="middle" font-family="Arial" font-size="18">A simple cycle that is hard to stop</text><rect x="535" y="260" width="130" height="240" rx="22" fill="#17191d" filter="url(#shadow)"/><rect x="550" y="285" width="100" height="175" rx="8" fill="#e8d9cf"/><rect x="560" y="300" width="80" height="38" rx="5" fill="#c9948c"/><rect x="560" y="350" width="80" height="38" rx="5" fill="#9ca4a3"/><rect x="560" y="400" width="80" height="38" rx="5" fill="#d3b9a7"/><circle cx="600" cy="145" r="55" fill="#1b1c20"/><text x="600" y="139" fill="#d29a97" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">1</text><text x="600" y="167" fill="white" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">CUE</text><text x="600" y="233" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="15">Something grabs attention</text><circle cx="900" cy="350" r="55" fill="#1b1c20"/><text x="900" y="344" fill="#d29a97" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">2</text><text x="900" y="372" fill="white" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">OPEN</text><text x="900" y="438" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="15">You enter the app</text><circle cx="600" cy="615" r="55" fill="#1b1c20"/><text x="600" y="609" fill="#d29a97" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">3</text><text x="600" y="637" fill="white" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">SAMPLE</text><text x="600" y="703" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="15">You consume a quick hit</text><circle cx="300" cy="350" r="55" fill="#1b1c20"/><text x="300" y="344" fill="#d29a97" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">4</text><text x="300" y="372" fill="white" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700">CONTINUE?</text><text x="300" y="438" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="15">One more swipe feels easy</text><path d="M650 160 C790 180 860 230 885 295" fill="none" stroke="#781d2a" stroke-width="6" stroke-linecap="round"/><path d="M875 410 C835 510 765 570 660 600" fill="none" stroke="#781d2a" stroke-width="6" stroke-linecap="round"/><path d="M540 600 C435 575 365 515 320 410" fill="none" stroke="#781d2a" stroke-width="6" stroke-linecap="round"/><path d="M315 295 C350 220 430 170 545 150" fill="none" stroke="#781d2a" stroke-width="6" stroke-linecap="round"/><circle cx="120" cy="730" r="26" fill="#781d2a"/><text x="165" y="718" fill="#171717" font-family="Arial" font-size="16" font-weight="700" letter-spacing="1">REWARD</text><text x="165" y="744" fill="#6d6a66" font-family="Arial" font-size="14">Unpredictable rewards</text><text x="165" y="765" fill="#6d6a66" font-family="Arial" font-size="14">keep you coming back</text><circle cx="405" cy="730" r="26" fill="#781d2a"/><text x="450" y="718" fill="#171717" font-family="Arial" font-size="16" font-weight="700" letter-spacing="1">HABIT</text><text x="450" y="744" fill="#6d6a66" font-family="Arial" font-size="14">Repetition makes</text><text x="450" y="765" fill="#6d6a66" font-family="Arial" font-size="14">the action automatic</text><circle cx="690" cy="730" r="26" fill="#781d2a"/><text x="735" y="718" fill="#171717" font-family="Arial" font-size="16" font-weight="700" letter-spacing="1">PERSONALIZATION</text><text x="735" y="744" fill="#6d6a66" font-family="Arial" font-size="14">The feed learns what</text><text x="735" y="765" fill="#6d6a66" font-family="Arial" font-size="14">keeps you engaged</text><circle cx="1030" cy="730" r="28" fill="#171717"/><text x="1030" y="738" fill="white" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700">–</text><text x="1070" y="720" fill="#171717" font-family="Arial" font-size="16" font-weight="700">STOP GATE</text><text x="1070" y="746" fill="#6d6a66" font-family="Arial" font-size="14">Friction breaks the loop.</text></svg>