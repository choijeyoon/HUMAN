<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img"><defs><linearGradient id="rosefade" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7b1d2b"/><stop offset="1" stop-color="#d5a3a0"/></linearGradient><linearGradient id="warm" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f5ede1"/><stop offset="1" stop-color="#e3c8bd"/></linearGradient><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity=".14"/></filter></defs><rect width="1200" height="800" fill="#f4efe5"/><text x="600" y="72" fill="#171717" text-anchor="middle" font-family="Georgia" font-size="44" font-weight="600">From Media to Meaning</text><text x="600" y="108" fill="#171717" text-anchor="middle" font-family="Arial" font-size="18">How dating news can reshape a fan’s inner world</text><circle cx="100" cy="190" r="22" fill="#171717"/><text x="100" y="198" fill="white" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">1</text><text x="170" y="184" fill="#171717" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="1.2">MEDIATED EXPOSURE</text><text x="170" y="220" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="16">Watch · stream · follow</text><text x="170" y="245" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="16">Repeated attention builds familiarity.</text><circle cx="520" cy="190" r="22" fill="#171717"/><text x="520" y="198" fill="white" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">2</text><text x="590" y="184" fill="#171717" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="1.2">INTERNAL SOCIAL MODEL</text><text x="590" y="220" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="16">The mind builds expectations</text><text x="590" y="245" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="16">about who this person is.</text><circle cx="940" cy="190" r="22" fill="#171717"/><text x="940" y="198" fill="white" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700">3</text><text x="1010" y="184" fill="#171717" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" letter-spacing="1.2">DISRUPTIVE INFORMATION</text><text x="1010" y="220" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="16">Dating news can violate</text><text x="1010" y="245" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="16">part of that expectation.</text><rect x="100" y="300" width="90" height="150" rx="16" fill="#111" transform="rotate(-8 145 375)"/><rect x="112" y="316" width="66" height="100" rx="5" fill="url(#warm)" transform="rotate(-8 145 375)"/><rect x="180" y="330" width="150" height="95" rx="8" fill="#23252a"/><rect x="195" y="345" width="120" height="63" fill="#cfaa99"/><circle cx="255" cy="376" r="18" fill="#33242a"/><path d="M525 510 C500 450 508 365 555 325 C600 286 680 296 708 350 C730 392 708 425 696 449 C684 473 702 490 725 505 C680 527 640 537 603 534 C570 531 543 522 525 510Z" fill="#171a20"/><path d="M530 390 C555 342 620 318 680 350" fill="none" stroke="#b8b0a9" stroke-width="4"/><rect x="603" y="350" width="82" height="72" rx="6" fill="#e6cabd"/><circle cx="644" cy="382" r="25" fill="#32232a"/><path d="M545 405 C580 420 600 455 615 505" fill="none" stroke="#d1c4b8" stroke-width="2" stroke-dasharray="5 7"/><path d="M690 390 C650 410 630 450 620 510" fill="none" stroke="#d1c4b8" stroke-width="2" stroke-dasharray="5 7"/><path d="M575 335 C590 370 600 390 603 420" fill="none" stroke="#d1c4b8" stroke-width="2" stroke-dasharray="5 7"/><rect x="900" y="322" width="200" height="175" rx="12" fill="#fff" filter="url(#shadow)"/><rect x="922" y="342" width="156" height="90" rx="6" fill="#d8c9bd"/><circle cx="960" cy="382" r="24" fill="#2d2427"/><circle cx="1037" cy="382" r="24" fill="#4d3939"/><text x="1000" y="463" fill="#781d2a" text-anchor="middle" font-family="Arial" font-size="15" font-weight="700" letter-spacing="1.6">BREAKING</text><text x="1000" y="488" fill="#171717" text-anchor="middle" font-family="Georgia" font-size="18" font-weight="600">Idol A is dating.</text><path d="M350 390 L485 390" stroke="#171717" stroke-width="3"/><path d="M470 378 L486 390 L470 402" fill="none" stroke="#171717" stroke-width="3"/><path d="M730 390 L865 390" stroke="#171717" stroke-width="3"/><path d="M850 378 L866 390 L850 402" fill="none" stroke="#171717" stroke-width="3"/><path d="M120 665 C210 560 290 560 370 660 C450 760 530 760 610 660 C690 560 770 560 850 660 C930 760 1010 750 1090 640" fill="none" stroke="url(#rosefade)" stroke-width="22" opacity=".8"/><text x="600" y="615" fill="#781d2a" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" letter-spacing="1.2">4  UPDATE &amp; EMOTION</text><text x="600" y="648" fill="#6d6a66" text-anchor="middle" font-family="Arial" font-size="18">The model updates — and emotion follows.</text><circle cx="210" cy="690" r="20" fill="#f1d9c7"/><text x="210" y="698" fill="#781d2a" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">☺</text><circle cx="375" cy="690" r="20" fill="#f1d9c7"/><text x="375" y="698" fill="#781d2a" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">–</text><circle cx="580" cy="690" r="20" fill="#f1d9c7"/><text x="580" y="698" fill="#781d2a" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">☹</text><circle cx="790" cy="690" r="20" fill="#f1d9c7"/><text x="790" y="698" fill="#781d2a" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">!</text><circle cx="990" cy="690" r="20" fill="#f1d9c7"/><text x="990" y="698" fill="#781d2a" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700">…</text></svg>