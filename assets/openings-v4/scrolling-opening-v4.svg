<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1800" role="img" aria-labelledby="title desc">
  <title id="title">Scrolling editorial opening</title>
  <desc id="desc">A person in a dark room faces a glowing phone while repeated feed layers recede upward, visualizing effortless continuation.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25241f"/><stop offset="1" stop-color="#0f0f0d"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3f0e8" stop-opacity=".95"/><stop offset="1" stop-color="#7d2b2b" stop-opacity="0"/></linearGradient>
    <linearGradient id="feed" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#f3f0e8" stop-opacity=".92"/><stop offset="1" stop-color="#cbc5b8" stop-opacity=".45"/></linearGradient>
  </defs>
  <rect width="1000" height="1800" fill="url(#room)"/>
  <rect x="54" y="54" width="892" height="1692" fill="none" stroke="#f3f0e8" stroke-opacity=".75" stroke-width="3"/>
  <text x="92" y="120" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="7" fill="#c76666">HUMAN / FEATURE 003</text>
  <g opacity=".9">
    <rect x="200" y="260" width="600" height="108" rx="18" fill="url(#feed)"/>
    <rect x="230" y="405" width="540" height="96" rx="18" fill="#f3f0e8" opacity=".72"/>
    <rect x="260" y="536" width="480" height="86" rx="18" fill="#f3f0e8" opacity=".52"/>
    <rect x="290" y="655" width="420" height="76" rx="18" fill="#f3f0e8" opacity=".34"/>
    <rect x="320" y="760" width="360" height="68" rx="18" fill="#f3f0e8" opacity=".2"/>
  </g>
  <g stroke="#7d2b2b" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M500 382 V398"/><path d="M500 514 V528"/><path d="M500 634 V648"/><path d="M500 742 V754"/>
  </g>
  <ellipse cx="500" cy="1250" rx="295" ry="350" fill="url(#glow)" opacity=".33"/>
  <circle cx="385" cy="1085" r="86" fill="#080807"/>
  <path d="M247 1530 C270 1332 303 1198 384 1198 C464 1198 498 1332 522 1530 Z" fill="#080807"/>
  <rect x="520" y="1050" width="210" height="402" rx="30" fill="#f3f0e8" stroke="#7d2b2b" stroke-width="8"/>
  <rect x="542" y="1090" width="166" height="300" rx="14" fill="#1b1a17"/>
  <g fill="#f3f0e8"><rect x="558" y="1113" width="134" height="50" rx="8" opacity=".9"/><rect x="558" y="1178" width="134" height="50" rx="8" opacity=".72"/><rect x="558" y="1243" width="134" height="50" rx="8" opacity=".54"/><rect x="558" y="1308" width="134" height="50" rx="8" opacity=".36"/></g>
  <circle cx="625" cy="1417" r="10" fill="#7d2b2b"/>
  <path d="M492 1328 C520 1305 541 1292 566 1275" stroke="#171713" stroke-width="22" stroke-linecap="round"/>
  <text x="92" y="1588" font-family="Georgia, serif" font-size="58" fill="#f3f0e8">continuation is cheap</text>
  <text x="92" y="1648" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="5" fill="#b9b3a7">STOPPING REQUIRES A DECISION POINT</text>
  <path d="M86 1678 H914" stroke="#f3f0e8" stroke-opacity=".75" stroke-width="2"/>
  <text x="92" y="1726" font-family="Arial, Helvetica, sans-serif" font-size="17" letter-spacing="4" fill="#b9b3a7">EDITORIAL ILLUSTRATION / NOT EMPIRICAL DATA</text>
</svg>