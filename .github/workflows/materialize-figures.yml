name: Materialize flagship figures

on:
  push:
    branches: ["agent/materialize-figures"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/materialize-figures

      - name: Materialize figure markup into source HTML
        run: python3 scripts/figure_integration.py

      - name: Commit generated article HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/articles/idol-dating-betrayal/index.html en/articles/ai-love/index.html en/articles/scrolling/index.html
          if git diff --cached --quiet; then
            echo "No materialization changes needed"
            exit 0
          fi
          git commit -m "Materialize flagship figures in article HTML"
          git push origin HEAD:agent/materialize-figures
