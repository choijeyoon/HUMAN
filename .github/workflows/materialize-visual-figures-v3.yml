name: Materialize visual figures v3

on:
  push:
    branches: ["agent/visual-explainer-figures-v3"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/visual-explainer-figures-v3

      - name: Update article source HTML
        run: python3 scripts/materialize_visual_figures_v3.py

      - name: Commit article HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/articles/idol-dating-betrayal/index.html en/articles/ai-love/index.html en/articles/scrolling/index.html
          if git diff --cached --quiet; then
            echo "No article changes needed"
            exit 0
          fi
          git commit -m "Use visual explainer figures in flagship articles"
          git push origin HEAD:agent/visual-explainer-figures-v3
