# GitHub Pages deployment for HUMAN
name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore and verify ultra-resolution cover
        shell: bash
        run: |
          set -euo pipefail
          cat assets/cover-ultra-v2/*.part | base64 --decode > assets/images/issue-001-cover-ultra-v2.avif
          test "$(stat -c%s assets/images/issue-001-cover-ultra-v2.avif)" -eq 148491
          echo "a7081b1bce4c2e11c1758806bb3e1db67f4e37a6480bbfa3fc8e654a52ca7d99  assets/images/issue-001-cover-ultra-v2.avif" | sha256sum -c -
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
