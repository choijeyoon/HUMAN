# GitHub Pages deployment for HUMAN
name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Restore and validate ultra-resolution cover
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode assets/cover-ultra/01.b64 > assets/images/issue-001-cover-ultra.jpg
          file assets/images/issue-001-cover-ultra.jpg
          file assets/images/issue-001-cover-ultra.jpg | grep -q 'JPEG image data'
          file assets/images/issue-001-cover-ultra.jpg | grep -q '1536x1024'
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
