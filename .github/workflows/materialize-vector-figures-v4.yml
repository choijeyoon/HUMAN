name: Materialize vector figures v4

on:
  push:
    branches: ["agent/retina-figures-v4"]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/retina-figures-v4
      - name: Update article source HTML
        run: python3 scripts/materialize_vector_figures_v4.py
      - name: Commit article HTML
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add en/articles/idol-dating-betrayal/index.html en/articles/ai-love/index.html en/articles/scrolling/index.html
          if git diff --cached --quiet; then
            echo "No article changes needed"
            exit 0
          fi
          git commit -m "Use scalable vector figures in flagship articles"
          git push origin HEAD:agent/retina-figures-v4
